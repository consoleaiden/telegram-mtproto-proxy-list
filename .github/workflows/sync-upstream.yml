name: Sync upstream and re-localize index.html

# Upstream (tgmtproxy/telegram-mtproto-proxy-list) regenerates its landing page
# every hour with fresh proxy data. This workflow pulls that snapshot, runs the
# Chinese localizer over it (translate.py), syncs the data files verbatim and
# pushes — so the GitHub Pages site always shows fresh data in Chinese, and the
# localization is never overwritten by an upstream sync.

on:
  schedule:
    # five minutes past every hour; upstream finishes its own update at :08 MSK (05:08 UTC),
    # so :23 UTC is safely after it in every run
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream snapshot
        run: |
          curl -fsSL https://codeload.github.com/tgmtproxy/telegram-mtproto-proxy-list/tar.gz/refs/heads/main -o /tmp/upstream.tgz
          mkdir -p /tmp/upstream
          tar -xzf /tmp/upstream.tgz -C /tmp/upstream --strip-components=1
          echo "upstream commit: $(curl -fsSL https://api.github.com/repos/tgmtproxy/telegram-mtproto-proxy-list/commits/main | grep -o '\"sha\": *\"[a-f0-9]\{40\}\"' | head -1)"

      - name: Re-localize index.html and sync data files
        run: |
          python3 translate.py /tmp/upstream/index.html index.html
          # data / support files come from upstream verbatim.
          # README.md is intentionally NOT synced: it documents this fork's
          # localization pipeline and must not be replaced by the upstream dump.
          for f in proxies.txt robots.txt .nojekyll; do
            if [ -f "/tmp/upstream/$f" ]; then cp "/tmp/upstream/$f" "$f"; fi
          done
          # never pull upstream automation over ours
          rm -rf /tmp/upstream/.github

      - name: Merge dubblebyte proxy list into proxies.txt
        run: |
          # second source: https://github.com/dubblebyte/free-mtproto-proxies
          # same `https://t.me/proxy?...` format, deduplicated by server+port+secret
          if curl -fsSL https://raw.githubusercontent.com/dubblebyte/free-mtproto-proxies/main/all_proxies.txt -o /tmp/extra_proxies.txt; then
            python3 merge_proxies.py proxies.txt /tmp/extra_proxies.txt > /tmp/proxies.merged.txt
            mv /tmp/proxies.merged.txt proxies.txt
          else
            echo "::warning::dubblebyte all_proxies.txt unavailable, publishing the primary list only"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "upstream unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore(sync): pull upstream data, re-localize index.html"
          git push
